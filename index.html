<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project TOXIN</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 6px; height: 6px; background: rgba(255, 255, 255, 0.9);
            transform: translate(-50%, -50%); border-radius: 50%;
            box-shadow: 0 0 4px #000; pointer-events: none; z-index: 10;
        }
        #hitmarker {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px; transform: translate(-50%, -50%) rotate(45deg);
            pointer-events: none; z-index: 11; display: none;
        }
        #hitmarker::before, #hitmarker::after {
            content: ''; position: absolute; background: red;
        }
        #hitmarker::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #hitmarker::after { top: 0; left: 9px; width: 2px; height: 20px; }

        /* Sniper Scope Overlay */
        #sniper-scope {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 15; display: none;
            background: radial-gradient(circle at center, transparent 32%, black 33%, black 100%);
        }
        #sniper-crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 100vw; height: 1px; background: rgba(0, 0, 0, 0.8);
            transform: translateY(-50%);
        }
        #sniper-crosshair-v {
            position: absolute; top: 50%; left: 50%;
            width: 1px; height: 100vh; background: rgba(0, 0, 0, 0.8);
            transform: translateX(-50%);
        }

        /* HUD */
        #hud {
            position: absolute; bottom: 25px; right: 35px; color: #fff;
            z-index: 10; text-align: right; text-shadow: 2px 2px 4px #000;
        }
        #weapon-name { font-size: 32px; font-weight: 800; letter-spacing: 1px; margin: 0; color: #ffcc00; }
        #ammo-display { font-size: 22px; font-weight: 600; color: #ddd; }

        #ui {
            position: absolute; top: 20px; left: 20px; color: white;
            z-index: 10; background: rgba(15, 15, 15, 0.85); padding: 16px;
            border-radius: 8px; border: 1px solid #333; backdrop-filter: blur(4px);
        }
        #critical-popup {
            position: absolute; top: 38%; left: 50%;
            transform: translate(-50%, -50%); color: #ff2222;
            font-size: 42px; font-weight: 900; display: none;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8), 2px 2px #000;
            pointer-events: none; z-index: 20; letter-spacing: 2px;
        }
        button { background: #ffcc00; border: none; padding: 7px 14px; font-weight: bold; border-radius: 4px; cursor: pointer; color: #111; }
        button:hover { background: #ffe066; }
        input { padding: 6px; width: 90px; border-radius: 4px; border: 1px solid #555; background: #222; color: #fff; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="hitmarker"></div>
    <div id="critical-popup">CRITICAL!</div>

    <div id="sniper-scope">
        <div id="sniper-crosshair"></div>
        <div id="sniper-crosshair-v"></div>
    </div>

    <div id="hud">
        <div id="weapon-name">AK-47</div>
        <div id="ammo-display">[1-7] Switch Weapon</div>
    </div>

    <div id="ui">
        <h3 style="margin: 0 0 8px 0; color: #ffcc00;">PROJECT TOXIN</h3>
        <button onclick="createParty()">Create Party</button>
        <input type="text" id="partyCode" placeholder="Code">
        <button onclick="joinParty()">Join</button>
        <p id="status" style="color: #aaa; font-size: 13px; margin: 8px 0;">Click anywhere to play.</p>
        <small style="color: #888;">
            <b>W, A, S, D</b>: Walk | <b>SPACE</b>: Jump | <b>SHIFT</b>: Sprint<br>
            <b>Right-Click</b>: Aim (ADS) | <b>Left-Click</b>: Shoot<br>
            <b>Keys 1 to 7</b>: Change Weapons
        </small>
    </div>

    <script>
        // --- 1. AUDIO SYNTHESIZER (No external sound files required) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playGunSound(pitch = 1, volume = 0.3) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const noise = audioCtx.createBufferSource();
            
            // Noise buffer
            const bufferSize = audioCtx.sampleRate * 0.08;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
            noise.buffer = buffer;

            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            noise.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        }

        function playHitSound(isCrit) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(isCrit ? 880 : 440, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        // --- 2. WEAPON DEFINITIONS (Matching your images) ---
        const WEAPONS = [
            { name: "AK-47", rate: 110, speed: 200, spread: 0.02, recoil: 0.08, zoom: 55, isSniper: false, pellets: 1 },
            { name: "Glock 17", rate: 180, speed: 160, spread: 0.015, recoil: 0.04, zoom: 60, isSniper: false, pellets: 1 },
            { name: "Micro Uzi", rate: 65, speed: 150, spread: 0.035, recoil: 0.05, zoom: 60, isSniper: false, pellets: 1 },
            { name: "MP40", rate: 120, speed: 170, spread: 0.018, recoil: 0.04, zoom: 55, isSniper: false, pellets: 1 },
            { name: "SPAS-12", rate: 500, speed: 140, spread: 0.06, recoil: 0.15, zoom: 60, isSniper: false, pellets: 8 },
            { name: "CheyTac M200", rate: 800, speed: 380, spread: 0.001, recoil: 0.25, zoom: 12, isSniper: true, pellets: 1 },
            { name: "Rocket Launcher", rate: 900, speed: 65, spread: 0.005, recoil: 0.3, zoom: 50, isSniper: false, pellets: 1, isRocket: true }
        ];
        let currentWepIdx = 0;

        // --- 3. SCENE, CAMERA & LIGHTS ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue
        scene.fog = new THREE.Fog(0x87ceeb, 20, 120);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.PointerLockControls(camera, document.body);
        document.body.addEventListener('click', () => { controls.lock(); audioCtx.resume(); });

        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(40, 60, 20);
        sun.castShadow = true;
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0x778899));

        // --- 4. 3D ARENA ENVIRONMENT (Deadshot style) ---
        // Ground
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x4a4f55 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Crates and Shipping Containers
        function spawnBox(x, y, z, w, h, d, color) {
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshLambertMaterial({ color })
            );
            mesh.position.set(x, y + h/2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
        }
        spawnBox(-8, 0, -15, 3, 3, 6, 0xcc5533); // Red Container
        spawnBox(8, 0, -20, 3, 3, 6, 0x2266aa);  // Blue Container
        spawnBox(0, 0, -28, 12, 4, 3, 0x555555); // Wall barrier
        spawnBox(-12, 0, -32, 2, 2, 2, 0x887755); // Wood crates
        spawnBox(12, 0, -32, 2, 2, 2, 0x887755);

        // Targets (Silhouette Dummy from Image 2)
        const targets = [];
        function spawnTarget(x, z) {
            const group = new THREE.Group();
            
            // Head
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.28, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0xd9383a })
            );
            head.position.y = 1.85;
            head.userData = { isHead: true };
            group.add(head);

            // Body
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.35, 0.35, 1.1, 16),
                new THREE.MeshLambertMaterial({ color: 0x1f2421 })
            );
            body.position.y = 1.05;
            body.userData = { isHead: false };
            group.add(body);

            // Stand pole
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.5), new THREE.MeshBasicMaterial({ color: 0x666 }));
            pole.position.y = 0.25;
            group.add(pole);

            group.position.set(x, 0, z);
            scene.add(group);
            targets.push(head, body);
        }
        spawnTarget(0, -12);
        spawnTarget(-6, -24);
        spawnTarget(6, -24);
        spawnTarget(0, -45);

        // --- 5. 3D GUN VIEWMODEL (Rendered in hands) ---
        const gunHolder = new THREE.Group();
        camera.add(gunHolder);
        scene.add(camera);

        const gunMesh = new THREE.Mesh(
            new THREE.BoxGeometry(0.08, 0.12, 0.65),
            new THREE.MeshLambertMaterial({ color: 0x222222 })
        );
        gunMesh.position.set(0.28, -0.25, -0.55);
        gunHolder.add(gunMesh);

        // --- 6. WASD CONTROLS & MOVEMENT ---
        const keys = {};
        let velocity = new THREE.Vector3();
        let canJump = false;

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            // Switch guns with keys 1 to 7
            if (e.key >= '1' && e.key <= '7') {
                currentWepIdx = parseInt(e.key) - 1;
                document.getElementById('weapon-name').innerText = WEAPONS[currentWepIdx].name;
            }
        });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        // --- 7. AIM DOWN SIGHTS (Right-Click) & SHOOTING ---
        let isAiming = false;
        let lastShootTime = 0;

        window.addEventListener('mousedown', (e) => {
            if (e.button === 2) isAiming = true;
            if (e.button === 0 && controls.isLocked) fireWeapon();
        });
        window.addEventListener('mouseup', (e) => {
            if (e.button === 2) isAiming = false;
        });

        const bullets = [];
        function fireWeapon() {
            const wep = WEAPONS[currentWepIdx];
            const now = performance.now();
            if (now - lastShootTime < wep.rate) return;
            lastShootTime = now;

            playGunSound(1.0, wep.isSniper ? 0.6 : 0.25);

            // Gun kick animation
            gunMesh.position.z += wep.recoil;
            gunMesh.rotation.x += wep.recoil * 1.5;

            // Bullet trajectories
            for (let p = 0; p < wep.pellets; p++) {
                const spread = isAiming ? (wep.spread * 0.2) : wep.spread;
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.x += (Math.random() - 0.5) * spread;
                dir.y += (Math.random() - 0.5) * spread;

                const tracer = new THREE.Mesh(
                    new THREE.SphereGeometry(wep.isRocket ? 0.12 : 0.04, 8, 8),
                    new THREE.MeshBasicMaterial({ color: wep.isRocket ? 0xff4400 : 0xffea00 })
                );
                tracer.position.copy(camera.position);
                scene.add(tracer);

                bullets.push({
                    mesh: tracer,
                    velocity: dir.multiplyScalar(wep.speed),
                    spawned: now,
                    isRocket: wep.isRocket
                });
            }
        }

        // --- 8. MAIN ANIMATION & PHYSICS LOOP ---
        let prevTime = performance.now();
        const gravity = -28.0;

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            // Player Walking & Sprinting
            if (controls.isLocked) {
                const speed = keys['ShiftLeft'] ? 16.0 : 9.0;
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y += gravity * delta;

                const moveDir = new THREE.Vector3();
                if (keys['KeyW']) moveDir.z += 1;
                if (keys['KeyS']) moveDir.z -= 1;
                if (keys['KeyA']) moveDir.x -= 1;
                if (keys['KeyD']) moveDir.x += 1;
                moveDir.normalize();

                if (keys['KeyW'] || keys['KeyS']) velocity.z += moveDir.z * speed * 8.0 * delta;
                if (keys['KeyA'] || keys['KeyD']) velocity.x += moveDir.x * speed * 8.0 * delta;

                controls.moveRight(velocity.x * delta);
                controls.moveForward(velocity.z * delta);

                camera.position.y += velocity.y * delta;
                if (camera.position.y < 1.6) {
                    velocity.y = 0;
                    camera.position.y = 1.6;
                    canJump = true;
                }
                if (keys['Space'] && canJump) {
                    velocity.y = 11.0;
                    canJump = false;
                }
            }

            // ADS Position & Scope Toggle
            const wep = WEAPONS[currentWepIdx];
            const targetFOV = isAiming ? wep.zoom : 75;
            camera.fov = THREE.MathUtils.lerp(camera.fov, targetFOV, delta * 15);
            camera.updateProjectionMatrix();

            const scopeOverlay = document.getElementById('sniper-scope');
            if (wep.isSniper && isAiming && camera.fov < 25) {
                scopeOverlay.style.display = 'block';
                gunMesh.visible = false;
            } else {
                scopeOverlay.style.display = 'none';
                gunMesh.visible = true;
            }

            // Gun recoil recovery
            const restX = isAiming ? 0 : 0.28;
            const restY = isAiming ? -0.16 : -0.25;
            const restZ = -0.55;
            gunMesh.position.x = THREE.MathUtils.lerp(gunMesh.position.x, restX, delta * 15);
            gunMesh.position.y = THREE.MathUtils.lerp(gunMesh.position.y, restY, delta * 15);
            gunMesh.position.z = THREE.MathUtils.lerp(gunMesh.position.z, restZ, delta * 10);
            gunMesh.rotation.x = THREE.MathUtils.lerp(gunMesh.rotation.x, 0, delta * 12);

            // Ballistic Bullets (Drop & Collision)
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.velocity.y += (b.isRocket ? -5.0 : -12.0) * delta; // Bullet drop
                const step = b.velocity.clone().multiplyScalar(delta);

                const ray = new THREE.Raycaster(b.mesh.position, b.velocity.clone().normalize(), 0, step.length());
                const hits = ray.intersectObjects(targets);

                if (hits.length > 0) {
                    const isHead = hits[0].object.userData.isHead;
                    playHitSound(isHead);
                    showHitmarker(isHead);
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                    continue;
                }

                b.mesh.position.add(step);

                if (time - b.spawned > 2500 || b.mesh.position.y <= 0) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        function showHitmarker(isCrit) {
            const hm = document.getElementById('hitmarker');
            hm.style.display = 'block';
            setTimeout(() => { hm.style.display = 'none'; }, 90);
            if (isCrit) {
                const crit = document.getElementById('critical-popup');
                crit.style.display = 'block';
                setTimeout(() => { crit.style.display = 'none'; }, 500);
            }
        }

        // Multiplayer Party Stubs
        function createParty() { alert("Party created! Share code: " + Math.random().toString(36).substring(2, 7).toUpperCase()); }
        function joinParty() { alert("Joined room!"); }
    </script>
</body>
</html>
