<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project Thunder</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px; background: red;
            transform: translate(-50%, -50%); border-radius: 50%;
            pointer-events: none; z-index: 10;
        }
        #ui {
            position: absolute; top: 15px; left: 15px; color: white;
            z-index: 10; background: rgba(0, 0, 0, 0.7); padding: 15px;
            border-radius: 8px; border: 1px solid #444;
        }
        #critical-popup {
            position: absolute; top: 40%; left: 50%;
            transform: translate(-50%, -50%); color: #ff1111;
            font-size: 38px; font-weight: bold; display: none;
            text-shadow: 2px 2px #000; pointer-events: none; z-index: 20;
        }
        button { padding: 6px 12px; cursor: pointer; }
        input { padding: 5px; width: 80px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="critical-popup">CRITICAL!</div>

    <div id="ui">
        <h3 style="margin: 0 0 10px 0;">Project Thunder</h3>
        <button onclick="startPractice()">Practice Range</button><br><br>
        <button onclick="createParty()">Create Party</button>
        <input type="text" id="partyCode" placeholder="Code">
        <button onclick="joinParty()">Join</button>
        <p id="status" style="color: #ffcc00; margin-top: 10px;">Click screen to lock aim & shoot.</p>
        <small>Right-Click = Aim (ADS)<br>Left-Click = Shoot</small>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let ws;
        let isAiming = false;
        let bullets = [];
        let targets = [];

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        controls = new THREE.PointerLockControls(camera, document.body);
        document.body.addEventListener('click', () => controls.lock());

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 20, 10);
        scene.add(light, new THREE.AmbientLight(0x555555));

        // Floor
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Dummy targets (Head + Body)
        function spawnDummy(z) {
            const group = new THREE.Group();
            
            // Head
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.25, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0xff3333 })
            );
            head.position.y = 1.8;
            head.userData = { isHead: true };
            group.add(head);

            // Body
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.3, 1.2, 16),
                new THREE.MeshLambertMaterial({ color: 0x3366ff })
            );
            body.position.y = 1.0;
            body.userData = { isHead: false };
            group.add(body);

            group.position.set(0, 0, z);
            scene.add(group);
            targets.push(head, body);
        }
        spawnDummy(-15);
        spawnDummy(-30);

        // Aim Down Sights (Right-Click)
        window.addEventListener('mousedown', (e) => {
            if (e.button === 2) {
                isAiming = true;
                camera.fov = 40;
                camera.updateProjectionMatrix();
            }
            if (e.button === 0 && controls.isLocked) {
                fire();
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 2) {
                isAiming = false;
                camera.fov = 75;
                camera.updateProjectionMatrix();
            }
        });

        // Ballistic shooting
        function fire() {
            const spread = isAiming ? 0.003 : 0.025;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.x += (Math.random() - 0.5) * spread;
            dir.y += (Math.random() - 0.5) * spread;

            const tracer = new THREE.Mesh(
                new THREE.SphereGeometry(0.06, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xffea00 })
            );
            tracer.position.copy(camera.position);
            scene.add(tracer);

            bullets.push({
                mesh: tracer,
                velocity: dir.multiplyScalar(130),
                spawned: performance.now()
            });

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: "shoot" }));
            }
        }

        const gravity = -18.0;
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const dt = (now - lastTime) / 1000;
            lastTime = now;

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.velocity.y += gravity * dt;
                const step = b.velocity.clone().multiplyScalar(dt);

                const ray = new THREE.Raycaster(b.mesh.position, b.velocity.clone().normalize(), 0, step.length());
                const hits = ray.intersectObjects(targets);

                if (hits.length > 0) {
                    if (hits[0].object.userData.isHead) {
                        showCritical();
                    }
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                    continue;
                }

                b.mesh.position.add(step);

                if (now - b.spawned > 2500 || b.mesh.position.y < 0) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        function showCritical() {
            const el = document.getElementById("critical-popup");
            el.style.display = "block";
            setTimeout(() => { el.style.display = "none"; }, 600);
        }

        function connect() {
            if (!ws) {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
                ws.onmessage = (e) => {
                    const msg = JSON.parse(e.data);
                    if (msg.type === "room_created") {
                        document.getElementById("status").innerText = "Party Code: " + msg.code;
                    } else if (msg.type === "room_joined") {
                        document.getElementById("status").innerText = "Joined Room: " + msg.code;
                    } else if (msg.type === "error") {
                        alert(msg.message);
                    }
                };
            }
        }

        function createParty() { connect(); ws.onopen = () => ws.send(JSON.stringify({ action: "create_room" })); }
        function joinParty() {
            connect();
            const code = document.getElementById("partyCode").value;
            ws.onopen = () => ws.send(JSON.stringify({ action: "join_room", code: code }));
        }
        function startPractice() {
            document.getElementById("status").innerText = "Practice Mode Active.";
        }
    </script>
</body>
</html>
